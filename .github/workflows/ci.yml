name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (iOS Simulator)
    # プロジェクトはXcode 27の形式で作られているため、Xcode 27が入ったイメージを使う（public preview）。
    # 判断の記録: docs/adr/0003-ci-runner.md
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Pick an iPhone simulator
        id: simulator
        # 一番新しい iOS の中から、通常の iPhone（例：iPhone 17、iPhone 17 Pro）を選ぶ。
        # 折りたたみなど特殊な機種は起動が遅く、画面テストが時間切れになったため避ける。
        # 通常の機種がなければ、どの iPhone でも使う。判断の記録: docs/adr/0003-ci-runner.md
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = [key for key in devices if ".iOS-" in key]
          runtimes.sort(key=lambda key: [int(part) for part in key.split(".iOS-")[1].split("-")], reverse=True)
          iphones = [
              device
              for key in runtimes
              for device in devices[key]
              if device["name"].startswith("iPhone") and device.get("isAvailable", False)
          ]
          regular = [device for device in iphones if re.fullmatch(r"iPhone \d+( Pro)?", device["name"])]
          if not iphones:
              sys.exit("No available iPhone simulator")
          print((regular or iphones)[0]["udid"])
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"

      - name: Boot the simulator
        # 起動に時間がかかっても、画面テストの「アプリの起動待ち」の時間に含まれないよう、先に起動しておく。
        run: |
          xcrun simctl boot "${{ steps.simulator.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.simulator.outputs.udid }}" -b

      - name: Build and run tests
        # 失敗したテストだけ、1 回だけやり直す。CI のシミュレーターでアプリの起動が時間切れになることがあるため
        # （PR #19 で、コードは変えずに再実行して通った）。2 回とも落ちたら、本当の失敗として扱う。
        # 判断の記録: docs/adr/0003-ci-runner.md
        run: |
          set -o pipefail
          xcodebuild test \
            -project PrenatalCheckupNote.xcodeproj \
            -scheme PrenatalCheckupNote \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: TestResults
          path: TestResults.xcresult
